<style>
@font-face{font-family:PixelZH;src:url('../../../../assets/fonts/fusion-pixel-12px-proportional.ttf')}
:root{--ink:#303247;--cream:#fff4d9;--gold:#ffe1a6;--coral:#e79777;--teal:#95e0d0;--surface:#fff9e8;--filter:#f3dfb6;--line:#d4a476}
*{box-sizing:border-box}body{margin:0;padding:24px;background:#202936;font:16px PixelZH,monospace;color:var(--cream);image-rendering:pixelated}
h1,h2,p{font-weight:400}.window{width:620px;background:var(--cream);color:var(--ink);border:4px solid var(--ink);box-shadow:8px 8px #0005}.bar{height:48px;padding:12px 16px;background:var(--ink);color:var(--gold);font-size:20px}.body{padding:20px 24px 18px}.eyebrow{font-size:14px;color:#8d5a62}.body h1{font-size:24px;margin:7px 0 10px}.body p{margin:0 0 12px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:9px;background:var(--filter);border:2px solid var(--line)}.control{min-height:38px;padding:8px 10px;background:var(--surface);border:2px solid var(--ink)}.rows{margin-top:12px;border:2px solid var(--ink)}.row{display:flex;min-height:38px;border-bottom:2px solid #eed7ab}.row:last-child{border:0}.tag{width:66px;display:grid;place-items:center;background:var(--coral);border-right:2px solid var(--ink)}.quote{flex:1;padding:8px 10px;background:var(--surface)}.selected .quote{background:var(--gold)}.buttons{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}.button{padding:8px 12px;background:var(--teal);border:2px solid var(--ink);box-shadow:3px 3px var(--ink)}
